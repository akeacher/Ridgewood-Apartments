# Netlify only needs to know which folder to serve. Headers live in
# dist/_headers, which Cloudflare Pages reads too, so nothing here is a
# barrier to moving hosts.
#
# There is deliberately no build command: dist/ is committed, so the host
# serves exactly the files that were tested locally. Rebuild it with
#   python3 tools/build_site.py
# and commit the result.

[build]
  publish = "dist"
